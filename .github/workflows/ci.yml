name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # compiler plugin tests; functional tests on the oldest and current Gradle, each with this and the next Kotlin
      - run: ./gradlew check --continue
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            */build/reports/tests/
            */build/test-results/

  compiler-compat:
    name: Compiler plugin on Kotlin ${{ matrix.kotlin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the jar as built, on newer compilers: binary compatibility check for shipping one jar
        kotlin: [ "2.5.0-Beta2" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :compiler-plugin:test -PkotlinTestCompilerVersion=${{ matrix.kotlin }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-compat-${{ matrix.kotlin }}-reports
          path: |
            compiler-plugin/build/reports/tests/
            compiler-plugin/build/test-results/

  oldest-kotlin:
    name: Gradle builds on the oldest supported Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # the compiler test framework's API changes between patch releases, so cover the oldest compiler with real builds
      - run: ./gradlew :gradle-plugin:test -PfunctionalTestKotlinVersions=2.4.20
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oldest-kotlin-reports
          path: |
            gradle-plugin/build/reports/tests/
            gradle-plugin/build/test-results/
