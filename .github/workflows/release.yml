name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write # for the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # v1.2.3 -> 1.2.3, overriding the -SNAPSHOT version in gradle.properties
      - name: Version from tag
        run: echo "ORG_GRADLE_PROJECT_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: ./gradlew check --continue

      # Each publishing step is skipped when its result already exists, so a failed run can be re-run as is.
      - name: Check what's already published
        id: published
        run: |
          version="$ORG_GRADLE_PROJECT_version"
          # 200 only: the Portal redirects what it doesn't host to Maven Central, which also has the plugin marker
          exists() { [ "$(curl -sI -o /dev/null -w '%{http_code}' "$1")" = 200 ] && echo true || echo false; }
          # Central: asks the Portal API rather than repo1.maven.org, which takes up to ~30 minutes to serve a release
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          curl -sf -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/deployments?namespace=io.github.tke&size=100" \
            > "$RUNNER_TEMP/deployments.json"
          jq -c '.deployments[] | {deploymentState, purls: [.deploymentComponents[]?.purl]}' "$RUNNER_TEMP/deployments.json"
          # true when both artifacts are in deployments that are publishing or published
          central=$(jq --arg v "$version" '
            [.deployments[] | select(.deploymentState == "PUBLISHING" or .deploymentState == "PUBLISHED")
              | .deploymentComponents[]?.purl] as $released
            | all("shush-compiler-plugin", "shush-gradle-plugin"; "pkg:maven/io.github.tke/\(.)@\($v)" | IN($released[]))
          ' "$RUNNER_TEMP/deployments.json")
          echo "central=$central" >> "$GITHUB_OUTPUT"
          echo "portal=$(exists "https://plugins.gradle.org/m2/io/github/tke/shush/io.github.tke.shush.gradle.plugin/$version/io.github.tke.shush.gradle.plugin-$version.pom")" >> "$GITHUB_OUTPUT"
          echo "github=$(gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish to Maven Central
        if: steps.published.outputs.central == 'false'
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Publish to Gradle Plugin Portal
        if: steps.published.outputs.portal == 'false'
        run: ./gradlew :gradle-plugin:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: GitHub release
        if: steps.published.outputs.github == 'false'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
