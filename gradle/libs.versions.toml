[versions]
# Oldest compiler supported, and the compiler each ShushCompat layer is built against.
compilerOldestSupported = "2.4.20"
compilerLayerK24 = "2.4.20"
compilerLayerK25 = "2.5.0-Beta2"
kotlin = "2.4.21"
buildconfig = "5.6.5"
tapmoc = "0.5.0"
junit = "4.13.2"
junit5 = "6.1.3"
mokkery = "3.5.1"

[libraries]
kotlin-compiler-oldestSupported = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "compilerOldestSupported" }
kotlin-compiler-layer-k24 = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "compilerLayerK24" }
kotlin-compiler-layer-k25 = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "compilerLayerK25" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
kotlin-compiler-test-framework = { module = "org.jetbrains.kotlin:kotlin-compiler-internal-test-framework", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit" }
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
mokkery-runtime = { module = "dev.mokkery:mokkery-runtime", version.ref = "mokkery" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlin-script-runtime = { module = "org.jetbrains.kotlin:kotlin-script-runtime", version.ref = "kotlin" }
kotlin-annotations-jvm = { module = "org.jetbrains.kotlin:kotlin-annotations-jvm", version.ref = "kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
